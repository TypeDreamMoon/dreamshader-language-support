name: Build VSIX Release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"
      - ".vscodeignore"
      - "package.json"
      - "package-lock.json"
      - "extension.js"
      - "templates.js"
      - "src/**"
      # The preview webview's runtime script. It ships in the VSIX and is the half of the preview
      # that actually paints frames, so a change confined to it is a change worth releasing -- and
      # without this line such a push would package nothing.
      - "media/**"
      - "language-configuration.json"
      - "install-vscode-extension.ps1"
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - "snippets/**"
      - "syntaxes/**"
      - "resources/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dreamshaderlang-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Package and publish VSIX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate extension entry
        run: node --check extension.js

      - name: Package VSIX
        run: npm run package

      - name: Read package version
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          VSIX="dreamshaderlang-language-support-${VERSION}.vsix"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "vsix=${VSIX}" >> "$GITHUB_OUTPUT"
          test -f "$VSIX"

      - name: Extract release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const version = process.env.VERSION;
          const lines = fs.readFileSync('CHANGELOG.md', 'utf8').split(/\r?\n/);
          const start = lines.findIndex((line) => line.trim() === `## ${version}`);
          let notes = `Automated DreamShaderLang Language Support release ${version}.`;
          if (start !== -1) {
            let end = lines.length;
            for (let index = start + 1; index < lines.length; index += 1) {
              if (/^##\s+/.test(lines[index])) {
                end = index;
                break;
              }
            }
            notes = lines.slice(start + 1, end).join('\n').trim() || notes;
          }
          fs.writeFileSync('release-notes.md', `${notes}\n`, 'utf8');
          NODE

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.vsix }}
          path: ${{ steps.version.outputs.vsix }}

      - name: Create version tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git fetch --tags --force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VSIX: ${{ steps.version.outputs.vsix }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md
            gh release upload "$TAG" "$VSIX" --clobber
          else
            gh release create "$TAG" "$VSIX" --title "$TAG" --notes-file release-notes.md
          fi

      # Publishes the same VSIX that was just attached to the release, so the two channels never
      # ship different bytes for one version. Requires a VSCE_PAT repository secret -- an Azure
      # DevOps token with Marketplace > Manage scope, for the publisher that owns the extension.
      # Without it this step says so and passes, leaving the GitHub release to stand on its own.
      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VERSION: ${{ steps.version.outputs.version }}
          VSIX: ${{ steps.version.outputs.vsix }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT is not set -- skipping the Marketplace publish." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # This workflow runs for pushes that bump no version -- a README edit is enough to trigger
          # it -- and the Marketplace rejects a re-publish of a version it already carries, which
          # would fail the run for no fault of the push. Ask it what it has before trying.
          PUBLISHED="$(node <<'NODE'
          const { publisher, name } = require('./package.json');
          const body = {
            filters: [{ criteria: [{ filterType: 7, value: `${publisher}.${name}` }] }],
            flags: 0x1
          };
          fetch('https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Accept: 'application/json;api-version=7.2-preview.1'
            },
            body: JSON.stringify(body)
          })
            .then((response) => response.json())
            // An unreadable answer resolves to empty, which attempts the publish rather than
            // skipping it: a duplicate fails loudly and visibly, a wrongly-skipped release is silent.
            .then((payload) => console.log(payload?.results?.[0]?.extensions?.[0]?.versions?.[0]?.version || ''))
            .catch(() => console.log(''));
          NODE
          )"

          PUBLISHED="$(printf '%s' "$PUBLISHED" | tr -d '[:space:]')"
          if [ "$PUBLISHED" = "$VERSION" ]; then
            # Nothing to publish -- but the credential is still checked rather than returning green
            # on one nothing has touched. A PAT lasts a year at most and rotating it is easy to
            # forget; without this, an expired token first shows up on the release that needed it,
            # which is the one run where a red step costs something.
            PUBLISHER="$(node -p "require('./package.json').publisher")"
            if npx @vscode/vsce verify-pat "$PUBLISHER"; then
              echo "Marketplace already carries $VERSION -- nothing to publish (VSCE_PAT verified)." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "VSCE_PAT cannot publish for '$PUBLISHER' -- expired, wrong scope, or wrong account. The next version bump would fail to reach the Marketplace." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Checked explicitly rather than left to the shell's -e: the summary line is a claim that
          # the version is live, and it must not be able to outlive a publish that failed.
          if npx @vscode/vsce publish --packagePath "$VSIX" --pat "$VSCE_PAT"; then
            echo "Published $VERSION to the Marketplace." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Marketplace publish of $VERSION FAILED -- the GitHub release still stands." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
